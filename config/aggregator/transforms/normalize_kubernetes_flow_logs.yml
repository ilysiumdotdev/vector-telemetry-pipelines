type: remap
inputs:
  - parse_json_kubernetes_flow_logs
source: |
  if !exists(.flow) {
    null
  }

  raw_verdict = string(.flow.verdict) ?? ""
  verdict = downcase(raw_verdict)

  allowed_verdicts = ["forwarded", "audit", "redirected"]
  denied_verdicts = ["dropped", "error"]

  network_event_type = null
  event_outcome = null

  if includes(allowed_verdicts, verdict) {
    network_event_type = "allowed"
    event_outcome = "success"
  } else if includes(denied_verdicts, verdict) {
    network_event_type = "denied"
    event_outcome = "failure"
  }

  if exists(.flow.uuid) {
    .event.id = .flow.uuid
  }
  .event.category = "network"
  if verdict != "" {
    .event.action = verdict
  }
  .event.type = compact(["connection", network_event_type])
  if event_outcome != null {
    .event.outcome = event_outcome
  }

  if exists(.flow.time) {
    .timestamp = .flow.time
  }

  .event.dataset = "kubernetes.flow"

  transport_key = null
  if exists(.flow.l4.TCP) {
    transport_key = "TCP"
  } else if exists(.flow.l4.UDP) {
    transport_key = "UDP"
  } else if exists(.flow.l4.ICMPv4) {
    transport_key = "ICMPv4"
  } else if exists(.flow.l4.ICMPv6) {
    transport_key = "ICMPv6"
  } else if exists(.flow.l4.SCTP) {
    transport_key = "SCTP"
  } else if exists(.flow.l4) {
    transport_key = "OTHER"
  }

  if transport_key != null {
    .network.transport = downcase!(transport_key)
  }

  if exists(.flow.traffic_direction) {
    .network.direction = downcase(string!(.flow.traffic_direction))
  }
  if exists(.flow.IP.ipVersion) {
    .network.type = downcase(string!(.flow.IP.ipVersion))
  }

  if exists(.flow.IP.source) {
    .source.ip = .flow.IP.source
  }
  if exists(.flow.ethernet.source) {
    .source.mac = .flow.ethernet.source
  }

  if transport_key != null && exists(.flow.l4) {
    source_port, err = get(.flow.l4, [transport_key, "source_port"])
    if err == null && source_port != null {
      .source.port = source_port
    }
  }

  if exists(.flow.source.labels) {
    source_labels = {}
    for_each(array!(.flow.source.labels)) -> |_index, label| {
      stripped = replace(string!(label), r'^k8s:', "")
      parts = split(stripped, "=", limit: 2)
      if length(parts) == 2 {
        source_labels = set!(source_labels, [parts[0]], parts[1])
      }
    }
    .source.labels = source_labels
  }

  if exists(.flow.source.namespace) {
    .source.namespace = .flow.source.namespace
  }
  if exists(.flow.source.pod_name) {
    .source.pod.name = .flow.source.pod_name
  }

  if exists(.flow.IP.destination) {
    .destination.ip = .flow.IP.destination
  }
  if exists(.flow.ethernet.destination) {
    .destination.mac = .flow.ethernet.destination
  }

  if transport_key != null && exists(.flow.l4) {
    destination_port, err = get(.flow.l4, [transport_key, "destination_port"])
    if err == null && destination_port != null {
      .destination.port = destination_port
    }
  }

  if exists(.flow.destination.labels) {
    destination_labels = {}
    for_each(array!(.flow.destination.labels)) -> |_index, label| {
      stripped = replace(string!(label), r'^k8s:', "")
      parts = split(stripped, "=", limit: 2)
      if length(parts) == 2 {
        destination_labels = set!(destination_labels, [parts[0]], parts[1])
      }
    }
    .destination.labels = destination_labels
  }

  if exists(.flow.destination.namespace) {
    .destination.namespace = .flow.destination.namespace
  }
  if exists(.flow.destination.pod_name) {
    .destination.pod.name = .flow.destination.pod_name
  }

  if exists(.flow.event_type) {
    .cilium.event_type.type = .flow.event_type.type
    .cilium.event_type.sub_type = .flow.event_type.sub_type
  }
  if exists(.flow.Type) {
    .cilium.flow_type = .flow.Type
  }
  if exists(.flow.trace_observation_point) {
    .cilium.trace.observation_point = .flow.trace_observation_point
  }
  if exists(.flow.trace_reason) {
    .cilium.trace.reason = .flow.trace_reason
  }
  if exists(.flow.is_reply) {
    .cilium.is_reply = .flow.is_reply
  }
  if exists(.flow.interface) {
    .cilium.interface.index = .flow.interface.index
    .cilium.interface.name = .flow.interface.name
  }
  if exists(.flow.Summary) {
    .cilium.summary = .flow.Summary
  }

  .orchestrator.type = "$${KUBERNETES_CLUSTER_TYPE}"
  .orchestrator.cluster.name = "$${KUBERNETES_CLUSTER_NAME}"

  del(.flow)
