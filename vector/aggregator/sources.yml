sources:
  unifi_logs:
    type: syslog
    address: 0.0.0.0:514
    mode: udp

  vector_agents:
    type: vector
    address: 0.0.0.0:8585
    tls:
      enabled: true
      ca_file: /etc/ssl/ilysium/ca.crt
      crt_file: /etc/ssl/vector/tls.crt
      key_file: /etc/ssl/vector/tls.key
      verify_certificate: true

  vector_aggregator_metrics:
    type: internal_metrics
    scrape_interval_secs: 1
    tags:
      host_key: host
