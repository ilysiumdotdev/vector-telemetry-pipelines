tests:
  - name: test_normalize_kubernetes_audit_logs_kubernetes_audit_contains_object_ref
    inputs:
      - insert_at: normalize_kubernetes_audit_logs
        type: log
        log_fields:
          objectRef:
            resource: "testObjects"
            namespace: "test-system"
            name: "test"
            apiGroup: "test.kubernetes.io"
            apiVersion: "v1"
    outputs:
      - extract_from: normalize_kubernetes_audit_logs
        conditions:
          - type: vrl
            source: |
              assert_eq!(.kubernetes.audit.objectRef.resource, "testObjects")
              assert_eq!(.kubernetes.audit.objectRef.namespace, "test-system")
              assert_eq!(.kubernetes.audit.objectRef.name, "test")
              assert_eq!(.kubernetes.audit.objectRef.apiGroup, "test.kubernetes.io")
              assert_eq!(.kubernetes.audit.objectRef.apiVersion, "v1")

  - name: test_normalize_kubernetes_audit_logs_kubernetes_audit_contains_user_identity
    inputs:
      - insert_at: normalize_kubernetes_audit_logs
        type: log
        log_fields:
          user:
            username: "system:serviceaccount:test:test"
            uid: "ffffffff-ffff-aaaa-aaaa-hhhhhhhhhhhh"
            groups: ["system:serviceaccounts", "system:authenticated"]
    outputs:
      - extract_from: normalize_kubernetes_audit_logs
        conditions:
          - type: vrl
            source: |
              assert_eq!(.kubernetes.audit.user.username, "system:serviceaccount:test:test")
              assert_eq!(.kubernetes.audit.user.uid, "ffffffff-ffff-aaaa-aaaa-hhhhhhhhhhhh")
              assert_eq!(.kubernetes.audit.user.groups, ["system:serviceaccounts", "system:authenticated"])

  - name: test_normalize_kubernetes_audit_logs_kubernetes_audit_contains_stage_and_verb
    inputs:
      - insert_at: normalize_kubernetes_audit_logs
        type: log
        log_fields:
          stage: "ResponseComplete"
          verb: "patch"
          requestURI: "/apis/test.kubernetes.io/v1/namespaces/test-system/testObjects"
    outputs:
      - extract_from: normalize_kubernetes_audit_logs
        conditions:
          - type: vrl
            source: |
              assert_eq!(.kubernetes.audit.stage, "ResponseComplete")
              assert_eq!(.kubernetes.audit.verb, "patch")
              assert_eq!(.kubernetes.audit.requestURI, "/apis/test.kubernetes.io/v1/namespaces/test-system/testObjects")

  - name: test_normalize_kubernetes_audit_logs_kubernetes_audit_contains_response_status
    inputs:
      - insert_at: normalize_kubernetes_audit_logs
        type: log
        log_fields:
          responseStatus:
            code: 200
    outputs:
      - extract_from: normalize_kubernetes_audit_logs
        conditions:
          - type: vrl
            source: |
              assert_eq!(.kubernetes.audit.responseStatus.code, 200)

  - name: test_normalize_kubernetes_audit_logs_maps_timestamp
    inputs:
      - insert_at: normalize_kubernetes_audit_logs
        type: log
        log_fields:
          requestReceivedTimestamp: "2026-01-01T00:00:00.000Z"
    outputs:
      - extract_from: normalize_kubernetes_audit_logs
        conditions:
          - type: vrl
            source: |
              assert_eq!(.timestamp, "2026-01-01T00:00:00.000Z")

  - name: test_normalize_kubernetes_audit_logs_maps_event_id
    inputs:
      - insert_at: normalize_kubernetes_audit_logs
        type: log
        log_fields:
          auditID: "00000000-0000-0000-0000-000000000000"
    outputs:
      - extract_from: normalize_kubernetes_audit_logs
        conditions:
          - type: vrl
            source: |
              assert_eq!(.event.id, "00000000-0000-0000-0000-000000000000")

  - name: test_normalize_kubernetes_audit_logs_maps_source_ip
    inputs:
      - insert_at: normalize_kubernetes_audit_logs
        type: log
        log_fields:
          sourceIPs: ["8.8.8.8"]
    outputs:
      - extract_from: normalize_kubernetes_audit_logs
        conditions:
          - type: vrl
            source: |
              assert_eq!(.source.ip, "8.8.8.8")

  - name: test_normalize_kubernetes_audit_logs_maps_user_name
    inputs:
      - insert_at: normalize_kubernetes_audit_logs
        type: log
        log_fields:
          user:
            username: "system:serviceaccount:test:test"
    outputs:
      - extract_from: normalize_kubernetes_audit_logs
        conditions:
          - type: vrl
            source: |
              assert_eq!(.user.name, "system:serviceaccount:test:test")

  - name: test_normalize_kubernetes_audit_logs_maps_user_roles
    inputs:
      - insert_at: normalize_kubernetes_audit_logs
        type: log
        log_fields:
          user:
            groups: ["system:serviceaccounts", "system:authenticated"]
    outputs:
      - extract_from: normalize_kubernetes_audit_logs
        conditions:
          - type: vrl
            source: |
              assert_eq!(.user.roles, ["system:serviceaccounts", "system:authenticated"])

  - name: test_normalize_kubernetes_audit_logs_maps_user_agent
    inputs:
      - insert_at: normalize_kubernetes_audit_logs
        type: log
        log_fields:
          userAgent: "test/v0.0.0"
    outputs:
      - extract_from: normalize_kubernetes_audit_logs
        conditions:
          - type: vrl
            source: |
              assert_eq!(.user_agent.original, "test/v0.0.0")

  - name: test_normalize_kubernetes_audit_logs_sets_event_dataset
    inputs:
      - insert_at: normalize_kubernetes_audit_logs
        type: log
        log_fields: {}
    outputs:
      - extract_from: normalize_kubernetes_audit_logs
        conditions:
          - type: vrl
            source: |
              assert_eq!(.event.dataset, "kubernetes.audit")

  - name: test_normalize_kubernetes_audit_logs_composes_action_with_subresource
    inputs:
      - insert_at: normalize_kubernetes_audit_logs
        type: log
        log_fields:
          objectRef:
            resource: "testObjects"
            subresource: "status"
          verb: "get"
    outputs:
      - extract_from: normalize_kubernetes_audit_logs
        conditions:
          - type: vrl
            source: |
              assert_eq!(.event.action, "testObjects.status.get")

  - name: test_normalize_kubernetes_audit_logs_composes_action_without_subresource
    inputs:
      - insert_at: normalize_kubernetes_audit_logs
        type: log
        log_fields:
          objectRef:
            resource: "testObjects"
          verb: "patch"
    outputs:
      - extract_from: normalize_kubernetes_audit_logs
        conditions:
          - type: vrl
            source: |
              assert_eq!(.event.action, "testObjects.patch")

  - name: test_normalize_kubernetes_audit_logs_maps_allow_decision_to_success_outcome
    inputs:
      - insert_at: normalize_kubernetes_audit_logs
        type: log
        log_fields:
          annotations:
            authorization.k8s.io/decision: "allow"
    outputs:
      - extract_from: normalize_kubernetes_audit_logs
        conditions:
          - type: vrl
            source: |
              assert_eq!(.event.outcome, "success")

  - name: test_normalize_kubernetes_audit_logs_maps_deny_decision_to_failure_outcome
    inputs:
      - insert_at: normalize_kubernetes_audit_logs
        type: log
        log_fields:
          annotations:
            authorization.k8s.io/decision: "deny"
    outputs:
      - extract_from: normalize_kubernetes_audit_logs
        conditions:
          - type: vrl
            source: |
              assert_eq!(.event.outcome, "failure")

  - name: test_normalize_kubernetes_audit_logs_drops_raw_fields
    inputs:
      - insert_at: normalize_kubernetes_audit_logs
        type: log
        log_fields:
          auditID: "test-id"
          objectRef:
            resource: "secrets"
            namespace: "test-system"
          verb: "get"
          userAgent: "test/v0.0.0"
          sourceIPs: ["1.1.1.1"]
          user:
            username: "test-user"
            groups: ["system:authenticated"]
          stage: "ResponseComplete"
          responseStatus:
            code: 200
          annotations:
            authorization.k8s.io/decision: "allow"
    outputs:
      - extract_from: normalize_kubernetes_audit_logs
        conditions:
          - type: vrl
            source: |
              assert!(!exists(.annotations))
              assert!(!exists(.auditID))
              assert!(!exists(.authenticationMetadata))
              assert!(!exists(.impersonatedUser))
              assert!(!exists(.level))
              assert!(!exists(.objectRef))
              assert!(!exists(.requestReceivedTimestamp))
              assert!(!exists(.requestURI))
              assert!(!exists(.responseStatus))
              assert!(!exists(.sourceIPs))
              assert!(!exists(.stage))
              assert!(!exists(.stageTimestamp))
              assert!(!exists(.user.extra))
              assert!(!exists(.user.groups))
              assert!(!exists(.user.uid))
              assert!(!exists(.user.username))
              assert!(!exists(.userAgent))
              assert!(!exists(.verb))
