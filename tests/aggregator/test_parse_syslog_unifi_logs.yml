tests:
  - name: test_parse_syslog_unifi_logs_extracts_priority_fields
    inputs:
      - insert_at: parse_syslog_unifi_logs
        type: log
        log_fields:
          message: "<134>Aug 7 15:13:01 test-device TEST payload content here"
    outputs:
      - extract_from: parse_syslog_unifi_logs
        conditions:
          - type: vrl
            source: |
              assert_eq!(.facility, "local0")
              assert_eq!(.severity, "info")

  - name: test_parse_syslog_unifi_logs_extracts_hostname
    inputs:
      - insert_at: parse_syslog_unifi_logs
        type: log
        log_fields:
          message: "<134>Aug 7 15:13:01 test-device TEST payload content here"
    outputs:
      - extract_from: parse_syslog_unifi_logs
        conditions:
          - type: vrl
            source: |
              assert_eq!(.hostname, "test-device")

  - name: test_parse_syslog_unifi_logs_extracts_appname
    inputs:
      - insert_at: parse_syslog_unifi_logs
        type: log
        log_fields:
          message: "<134>Aug 7 15:13:01 test-device CEF:0|TestVendor|TestProduct|1.0|100|Test Event|5|TESTfield=value1 src=1.1.1.1 msg=this is a test message"
    outputs:
      - extract_from: parse_syslog_unifi_logs
        conditions:
          - type: vrl
            source: |
              assert_eq!(.appname, "CEF")

  - name: test_parse_syslog_unifi_logs_preserves_cef_payload_intact
    inputs:
      - insert_at: parse_syslog_unifi_logs
        type: log
        log_fields:
          message: "<134>Aug 7 15:13:01 test-device CEF:0|TestVendor|TestProduct|1.0|100|Test Event|5|TESTfield=value1 src=1.1.1.1 msg=this is a test message"
    outputs:
      - extract_from: parse_syslog_unifi_logs
        conditions:
          - type: vrl
            source: |
              assert_eq!(.message, "CEF:0|TestVendor|TestProduct|1.0|100|Test Event|5|TESTfield=value1 src=1.1.1.1 msg=this is a test message")

  - name: test_parse_syslog_unifi_logs_keeps_message_on_invalid_syslog
    inputs:
      - insert_at: parse_syslog_unifi_logs
        type: log
        log_fields:
          message: "invalid syslog line"
    outputs:
      - extract_from: parse_syslog_unifi_logs
        conditions:
          - type: vrl
            source: |
              assert!(exists(.message))

  - name: test_parse_syslog_unifi_logs_prefers_parsed_timestamp_when_present
    inputs:
      - insert_at: parse_syslog_unifi_logs
        type: log
        log_fields:
          message: "<134>Aug 7 15:00:00 test-device TEST payload content here"
    outputs:
      - extract_from: parse_syslog_unifi_logs
        conditions:
          - type: vrl
            source: |
              assert_eq!(format_timestamp!(.timestamp, "%Y-%m-%dT%H:%M:%SZ"), "2026-08-07T15:00:00Z")

  - name: test_parse_syslog_unifi_logs_falls_back_to_vector_timestamp_when_absent
    inputs:
      - insert_at: parse_syslog_unifi_logs
        type: log
        log_fields:
          message: "no priority or timestamp"
    outputs:
      - extract_from: parse_syslog_unifi_logs
        conditions:
          - type: vrl
            source: |
              assert!(is_timestamp(.timestamp))
