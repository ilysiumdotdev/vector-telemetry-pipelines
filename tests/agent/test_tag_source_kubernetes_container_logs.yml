tests:
  - name: test_tag_source_kubernetes_logs_populates_source
    inputs:
      - insert_at: tag_source_kubernetes_container_logs
        type: log
        log_fields:
          message: "{}"
    outputs:
      - extract_from: tag_source_kubernetes_container_logs
        conditions:
          - type: vrl
            source: |
              assert_eq!(.@vector.source, "kubernetes.container")
