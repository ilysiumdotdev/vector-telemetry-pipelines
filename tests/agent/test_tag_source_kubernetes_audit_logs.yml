tests:
  - name: test_tag_kubernetes_audit_logs_populates_source
    inputs:
      - insert_at: tag_source_kubernetes_audit_logs
        type: log
        log_fields:
          message: "{}"
    outputs:
      - extract_from: tag_source_kubernetes_audit_logs
        conditions:
          - type: vrl
            source: |
              assert_eq!(.@vector.source, "kubernetes.audit")
