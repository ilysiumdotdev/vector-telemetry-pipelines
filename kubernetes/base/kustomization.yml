apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - agent
  - aggregator
  - elastic-ca.yml
  - helmrepository.yml
  - secretstore.yml
  - udproutes.yml

configMapGenerator:
  - name: vector-base
    files:
      - ../../config/vector.yml

  - name: vector-agent-sources
    files:
      - ../../config/agent/sources/kubernetes_audit_logs.yml
      - ../../config/agent/sources/kubernetes_container_logs.yml
      - ../../config/agent/sources/kubernetes_flow_logs.yml
      - ../../config/agent/sources/kubernetes_host_metrics.yml
      - ../../config/agent/sources/vector_agent_metrics.yml

  - name: vector-agent-transforms
    files:
      - ../../config/agent/transforms/tag_stream_kubernetes_audit_logs.yml
      - ../../config/agent/transforms/tag_stream_kubernetes_container_logs.yml
      - ../../config/agent/transforms/tag_stream_kubernetes_flow_logs.yml
      - ../../config/agent/transforms/tag_stream_kubernetes_host_metrics.yml
      - ../../config/agent/transforms/tag_stream_vector_agent_metrics.yml

  - name: vector-agent-sinks
    files:
      - ../../config/agent/sinks/vector_aggregator.yml

  - name: vector-aggregator-sources
    files:
      - ../../config/aggregator/sources/unifi_logs.yml
      - ../../config/aggregator/sources/vector_agents.yml
      - ../../config/aggregator/sources/vector_aggregator_metrics.yml

  - name: vector-aggregator-transforms
    files:
      - ../../config/aggregator/transforms/normalize_kubernetes_audit_logs.yml
      - ../../config/aggregator/transforms/normalize_kubernetes_container_logs.yml
      - ../../config/aggregator/transforms/normalize_kubernetes_flow_logs.yml
      - ../../config/aggregator/transforms/parse_json.yml
      - ../../config/aggregator/transforms/parse_unifi.yml
      - ../../config/aggregator/transforms/route_agent_streams.yml
      - ../../config/aggregator/transforms/route_parsed_streams.yml
      - ../../config/aggregator/transforms/tag_elastic_data_stream_kubernetes_audit_logs.yml
      - ../../config/aggregator/transforms/tag_elastic_data_stream_kubernetes_container_logs.yml
      - ../../config/aggregator/transforms/tag_elastic_data_stream_kubernetes_flow_logs.yml
      - ../../config/aggregator/transforms/tag_elastic_data_stream_kubernetes_host_metrics.yml
      - ../../config/aggregator/transforms/tag_elastic_data_stream_unifi_logs.yml
      - ../../config/aggregator/transforms/tag_elastic_data_stream_vector_agent_metrics.yml
      - ../../config/aggregator/transforms/tag_elastic_data_stream_vector_aggregator_metrics.yml
      - ../../config/aggregator/transforms/tag_stream_unifi_logs.yml
      - ../../config/aggregator/transforms/tag_stream_vector_aggregator_metrics.yml

  - name: vector-aggregator-sinks
    files:
      - ../../config/aggregator/sinks/elasticsearch_logs.yml
      - ../../config/aggregator/sinks/elasticsearch_metrics.yml

generatorOptions:
  disableNameSuffixHash: true
